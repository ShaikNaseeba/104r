<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><center>TELANGANA STATE ROAD TRANSPORT CORPORATION</center></h1>
    <h1><center>GENERAL BUS PASS APPLICATION</center></h1>
    <form action="./response.html" autocomplete="off">
            <fieldset><legend>Application Details</legend>

            <label for="">Name</label>
            <input type="text" required maxlength="20">

            <label for="">&nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp Father's / Guardian's name</label>
            <input type="text" required>

            <br><br>

            <label for="">Date of birth</label>
            <input type="date" required>

            <label for=""> &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp Gender</label>
            <input type="radio" name="gender" required>Female
            <input type="radio" name="gender" required>Male

            <br><br>

            <label for="">Age As on:</label>
            <input type="number">Year(s)
            <input type="number">Months(s)
            <input type="number">Days(s)

            <label for=""> &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp Aadhaar No:</label>
            <input type="text">

            <br><br>

            <label for="">WhatsApp No</label>
            <input type="tel" required pattern="[6-9][0-9]+" minlength="10" maxlength="10">

            <label for=""> &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp E-mail Id</label>
            <input type="email" required pattern="[a-z]+[0-9]+@gmail.com" >

            <br><br>

            <label for="">Photo</label>
            <input type="file" required>

            </fieldset>

            <fieldset><legend>Residental Address Details</legend>

            <label for="">Applicant's Address</label>
            <input type="textarea" maxlength="20" required>

            <label for=""> &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp District</label>
            <select name="" id="" required>
                <option value="">HYDERABAD</option>
            </select>

            <br><br>

            <label for="">Mandal</label>
            <select name="" id="">
                <option value="">HYDERABAD</option>
            </select>

            <label for=""> &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp Village</label>
            <select name="" id="">
                <option value="">HYDERABAD</option>
                <option value="">JAYADARSHINI</option>
            </select>

            <br><br>

            <label for="">Pincode</label>
            <input type="tel" required>

            </fieldset>

            <fieldset><legend>Pass Type Details</legend>

                <label for="">City</label>
                <select name="" id="" required>
                    <option value="" readonly>Hyderabad</option>
                </select>

                <br><br>

                <label for="">Pass Type</label>
                <select name="" id="" required>
                    <option value="" readonly><center>-----Select----- </center></option>
                    <option value="">GREATER PASS</option>
                    <option value="">GENERAL ORDINARY ROUTE PASS MTLY</option>
                    <option value="">GENERAL METRO EXPRESS ROUTE PASS MTLY</option>
                    <option value="">ORDINARY PASS</option>
                    <option value="">METRO EXPRESS PASS</option>
                    <option value="">METRO DELUXE PASS</option>
                </select>

            </fieldset>

            <fieldset><legend>Mode of Payment & Pass Collection</legend>

                <label for="">Payment Mode</label>
                <select name="" id="" required>
                    <option value="" readonly>Select Payment Mode</option>
                    <option value="">Payment at Counter</option>
                </select>

                <br><br>

                <label for="">Pass Delivery Mode</label>
                <select name="" id="" required>
                    <option value="" readonly>Select Pass Delivery Mode</option>
                    <option value="">At Counter</option>
                </select>

                <br><br>

                <label for="">Center at which <br>you want to collect <br>Pass</label>
                <select name="" id="">
                    <option value="" readonly>-----Select-----</option>
                    <option value="">RTC AFZALGUNJ -- HYD <br>[09/09/2026]</option>
                    <option value="">RTC AIRPORT -- HYD <br>[08/09/2026]</option>
                    <option value="">RTC ARAMGHAR -- HYD <br>[09/09/2026]</option>
                    <option value="">RTC BALA NAGAR -- HYD <br>[09/09/2026]</option>
                    <option value="">RTC BORABANDA -- HYD <br>[09/09/2026]</option>
                    <option value="">RTC CBS -- HYD <br>[09/09/2026]</option>
                    <option value="">RTC CHARMINAR -- HYD <br>[08/09/2026]</option>
                </select>

            </fieldset>

            <input type="submit" value="Submit">&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="reset" value="Clear">
    </form>
</body>
</html>
