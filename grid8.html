<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent>*{
            background-color: darkcyan;
        }
        .parent{
            display: grid;
            grid-template-columns: repeat(5,1fr);
            height: 100vh;
            gap: 20px;
        }
        .child1{
            grid-row: 1/4;
            grid-column: 1/3;
        }
        .child2{
            grid-column: 3/5;
            grid-row: 2/3;
            grid-row-start: 1;
            grid-column-start: 3;
        }
    </style>
</head>
<body>
    <div class="parent">
         <div class="child1">ITEM-1</div>
        <div class="child2">ITEM-2</div>
        <div class="child3">ITEM-3</div>
        <div class="child4">ITEM-4</div>
        <div class="child5">ITEM-5</div>
        <div class="child6">ITEM-6</div>
        <div class="child7">ITEM-7</div>
    </div>
</body>
</html>
