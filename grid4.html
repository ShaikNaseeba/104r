<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent>*{
            background-color: aqua;
        }
        .parent{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            height: 100vh;
            gap: 20px;
        }
        .child4{
            grid-row: 2/4;
        }
        .child2{
            grid-column-start: 2;
            grid-row: 1/3;
        }
        .child6{
            grid-column-start: 3;
            grid-row: 2/4;

        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child1">ITEM-1</div>
        <div class="child2">ITEM-2</div>
        <div class="child3">ITEM-3</div>
        <div class="child4">ITEM-4</div>
        <div class="child5">ITEM-5</div>
        <div class="child6">ITEM-6</div>
    </div>
</body>
</html>
