    <style>
        .parent{
            display: grid;
            height: 100vh;
            gap: 10px;
            grid-template-rows: repeat(6,115px);
            grid-template-areas:
            'child1 child2 child3'
            'child4 child2 child6'
            'child4 child5 child6'
            'child7 child5 child6'
            'child7 child5 child6'
            'child7 child8 child6';
        }
        .parent>img{
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
        .child1{
            grid-area: child1;
        }
        .child2{
            grid-area: child2;
        }
        .child3{
            grid-area: child3;
        }
        .child4{
            grid-area: child4;
        }
         .child5{
            grid-area: child5;
        }
        .child6{
            grid-area: child6;
        }
        .child7{
            grid-area: child7;
        }
        .child8{
            grid-area: child8;
        }
    </style>
</head>
